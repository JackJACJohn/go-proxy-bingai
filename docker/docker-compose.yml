version: '3.8'

services:
  go-proxy-bingai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: go-proxy-bingai:latest
    container_name: go-proxy-bingai
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 人机验证服务器地址 (可选)
      - BYPASS_SERVER=https://bypass.zklcdc.xyz
      
      # Bing API 基础地址 (可选)
      # - BING_BASE_URL=https://www.bing.com
      # - SYDNEY_BASE_URL=https://sydney.bing.com
      
      # 代理设置 (可选)
      # - HTTP_PROXY=http://172.17.0.1:18080
      # - HTTPS_PROXY=http://172.17.0.1:18080
      
      # 用户令牌 (可选，用于多用户)
      # - Go_Proxy_BingAI_USER_TOKEN_1=your_token_1
      # - Go_Proxy_BingAI_USER_TOKEN_2=your_token_2
      
      # 用户 Cookie (可选，用于保持登录状态)
      # - USER_KievRPSSecAuth=your_kiev_cookie
      # - USER_RwBf=your_rwbf_cookie
      # - USER_MUID=your_muid_cookie
      
      # API 密钥 (可选，用于 API 访问控制)
      # - Go_Proxy_BingAI_AUTH_KEY=sk-xxx,sk-yyy
      
      # 日志级别 (可选: DEBUG, INFO, WARN, ERROR)
      - LOG_LEVEL=INFO
      
      # 端口设置 (默认: 8080)
      - PORT=8080
      
      # 本地模式 (只监听 127.0.0.1，设置任意值启用)
      # - LOCAL_MODE=true
      
      # 调试模式 (设置任意值启用)
      # - Go_Proxy_BingAI_Debug=true
    
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # 资源限制 (可选)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.5'
    #       memory: 256M
    
    # 网络配置
    networks:
      - bingai-network

networks:
  bingai-network:
    driver: bridge
